<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ежемесячный отчет 🖤 сеть Яценко</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключение Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Подключение шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://xfood.tech/favicon.ico">
</head>

<body>

    <!-- Фоновые слои -->
    <div id="app-bg"></div>
    <div id="app-overlay"></div>

    <div
        class="container mx-auto px-4 py-6 sm:p-6 lg:p-8 max-w-[1600px] w-full relative z-10 flex flex-col min-h-screen">

        <!-- Верхняя панель управления: Навигация и Выбор периода -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 sm:gap-6 mb-8 sm:mb-10 w-full">
            <!-- Навигация -->
            <div class="nav-pills w-full sm:w-auto mx-auto md:mx-0">
                <button id="tab-summary" class="tab-btn active">Общая сводка</button>
                <button id="tab-pizzeria" class="tab-btn">Отчет по пиццерии</button>
                <button id="tab-dynamics" class="tab-btn">Динамика %</button>
            </div>

            <!-- Выбор периода -->
            <div id="period-selector-container" class="w-full sm:w-64 relative flex-shrink-0 group mx-auto md:mx-0">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-emerald-400 z-20">
                    <svg class="w-5 h-5 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                </div>
                <select id="period-select"
                    class="custom-select w-full pl-12 pr-10 py-3 sm:py-3.5 text-sm sm:text-base font-semibold tracking-wide text-left sm:text-center appearance-none relative z-10 shadow-lg">
                    <!-- Заполняется JS -->
                </select>
            </div>
        </header>

        <!-- 1. ВКЛАДКА: СВОДКА -->
        <main id="page-summary" class="fade-in max-w-6xl w-full mx-auto flex-grow">
            <!-- Верхний блок: KPI и ТОП-3 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 sm:gap-6 lg:gap-8 2xl:gap-10 mb-6 sm:mb-8">
                <!-- Главный KPI -->
                <div
                    class="glass-card p-5 sm:p-6 lg:p-8 text-center flex flex-col justify-center items-center relative overflow-hidden md:col-span-1 min-h-[160px] sm:min-h-[220px]">
                    <div
                        class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-32 sm:w-40 h-32 sm:h-40 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none">
                    </div>

                    <h2 class="text-xs sm:text-sm font-bold uppercase tracking-widest mb-2 opacity-80 spatial-text"
                        style="color: var(--text-muted)">Средний % по сети</h2>
                    <div class="inline-flex items-baseline relative z-10">
                        <span
                            class="text-6xl sm:text-7xl lg:text-8xl 2xl:text-9xl font-bold tracking-tighter transition-all duration-500 text-slate-100 spatial-text"
                            id="network-average-score">0%</span>
                    </div>
                </div>

                <!-- ТОП-3 Пиццерий -->
                <div class="glass-card p-5 sm:p-6 2xl:p-8 relative overflow-hidden md:col-span-2 flex flex-col justify-center"
                    id="network-top3-container">
                    <!-- Заполняется JS -->
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6 lg:gap-8 2xl:gap-10">
                <div id="network-c5-violations"></div>
                <div id="network-c10-violations"></div>
            </div>
        </main>

        <!-- 2. ВКЛАДКА: ПИЦЦЕРИЯ -->
        <main id="page-pizzeria" class="hidden fade-in max-w-7xl w-full mx-auto flex-grow">
            <!-- Компактная плашка выбора пиццерии (Идентична периоду) -->
            <div class="flex justify-center mb-8 px-2 sm:px-0">
                <div class="w-full sm:w-72 relative group">
                    <div
                        class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-emerald-400 z-20">
                        <svg class="w-5 h-5 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </div>
                    <select id="pizzeria-select"
                        class="custom-select w-full pl-12 pr-10 py-3 sm:py-3.5 text-sm sm:text-base font-semibold tracking-wide text-left sm:text-center appearance-none relative z-10 shadow-lg">
                        <!-- Заполняется JS -->
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 lg:gap-8 2xl:gap-10">
                <div class="lg:col-span-5 flex flex-col gap-5 sm:gap-6 2xl:gap-8">
                    <div id="pizzeria-score-container"></div>
                    <div id="pizzeria-ranking-container"></div>
                </div>
                <div class="lg:col-span-7 flex flex-col gap-5 sm:gap-6 2xl:gap-8">
                    <div id="pizzeria-violations-container" class="flex flex-col gap-5 sm:gap-6 2xl:gap-8"></div>
                </div>
            </div>
        </main>

        <!-- 3. ВКЛАДКА: ДИНАМИКА -->
        <main id="page-dynamics" class="hidden fade-in max-w-6xl w-full mx-auto space-y-6 sm:space-y-8 flex-grow">

            <div class="glass-card p-5 sm:p-6 lg:p-8 w-full relative overflow-hidden">
                <div
                    class="absolute -top-20 -right-20 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none">
                </div>
                <div class="flex items-center mb-6 relative z-10">
                    <div class="w-1.5 h-6 bg-emerald-400 rounded-full mr-3 shadow-[0_0_12px_rgba(52,211,153,0.6)]">
                    </div>
                    <h2 class="text-lg sm:text-xl font-bold tracking-tight spatial-text">Динамика по сети</h2>
                </div>
                <div class="chart-wrapper relative z-10">
                    <canvas id="dynamicsNetworkChart"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8 2xl:gap-10">
                <div class="glass-card p-5 sm:p-6 lg:p-8 w-full relative overflow-hidden">
                    <div
                        class="absolute -top-20 -right-20 w-64 h-64 bg-slate-400/10 rounded-full blur-3xl pointer-events-none">
                    </div>
                    <div
                        class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-6 gap-4 relative z-10">
                        <div class="flex items-center">
                            <div
                                class="w-1.5 h-6 bg-slate-400 rounded-full mr-3 shadow-[0_0_12px_rgba(148,163,184,0.5)]">
                            </div>
                            <h2 class="text-base sm:text-lg font-bold spatial-text">Пиццерия</h2>
                        </div>
                        <select id="dynamics-pizzeria-select"
                            class="custom-select w-full xl:w-auto text-xs sm:text-sm py-2 sm:py-2.5 px-4 pl-4 font-medium">
                            <!-- Заполняется JS -->
                        </select>
                    </div>
                    <div class="chart-wrapper dynamics-side relative z-10">
                        <canvas id="dynamicsPizzeriaChart"></canvas>
                    </div>
                </div>

                <div class="glass-card p-5 sm:p-6 lg:p-8 w-full relative overflow-hidden">
                    <div
                        class="absolute -top-20 -right-20 w-64 h-64 bg-slate-300/10 rounded-full blur-3xl pointer-events-none">
                    </div>
                    <div
                        class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-6 gap-4 relative z-10">
                        <div class="flex items-center">
                            <div
                                class="w-1.5 h-6 bg-slate-300 rounded-full mr-3 shadow-[0_0_12px_rgba(203,213,225,0.5)]">
                            </div>
                            <h2 class="text-base sm:text-lg font-bold spatial-text">Менеджер</h2>
                        </div>
                        <select id="dynamics-manager-select"
                            class="custom-select w-full xl:w-auto text-xs sm:text-sm py-2 sm:py-2.5 px-4 pl-4 font-medium">
                            <!-- Заполняется JS -->
                        </select>
                    </div>
                    <div class="chart-wrapper dynamics-side relative z-10">
                        <canvas id="dynamicsManagerChart"></canvas>
                    </div>
                </div>
            </div>
        </main>

        <!-- Футер -->
        <footer
            class="text-center mt-12 sm:mt-16 pt-6 sm:pt-8 border-t border-white/10 text-xs sm:text-sm opacity-60 pb-6 spatial-text w-full">
            <p>2026 Отчет сформирован автоматически = проверяйте данные в ЛК СРМ <a href="https://app.xfood.tech"
                    target="_blank"
                    class="text-emerald-300 hover:text-emerald-400 font-medium transition-colors ml-1">app.xfood.tech</a>
            </p>
        </footer>
    </div>

    <script src="index.js"></script>
</body>

</html>
